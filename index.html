<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TUHIN ONLINE SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Hind Siliguri', sans-serif; }
  :root { --neon: #00d4ff; --cyan: #00ffea; --green: #00e676; --purple: #7c4dff; --orange: #ff9800; --red: #ff1744; --pink: #ff4081; --bg: #050810; --card: #0d1826; --card2: #101d2e; --border: #1a2c47; --border2: #223a5c; --text: #e8f4ff; --muted: #6b8aad; }
  html, body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at top, rgba(0,212,255,0.08), transparent 60%); z-index: -1; }
  .app { max-width: 500px; margin: 0 auto; min-height: 100vh; padding-bottom: 85px; }

  /* TOP BAR */
  .topbar { position: sticky; top: 0; z-index: 100; background: rgba(5,8,16,0.98); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand-box { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand-logo { width: 42px; height: 42px; background: linear-gradient(135deg, #00d4ff, #7c4dff); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; box-shadow: 0 0 15px rgba(0,212,255,0.5); }
  .brand-name { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #fff; line-height: 1.2; }
  .brand-name small { display: block; color: var(--cyan); font-size: 9px; letter-spacing: 2px; margin-top: 2px; }
  .top-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .btn-login { background: linear-gradient(135deg, #00d4ff, #7c4dff); color: #fff; border: none; padding: 7px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .btn-register { background: linear-gradient(135deg, #ff4081, #ff1744); color: #fff; border: none; padding: 7px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .balance-pill { display: flex; align-items: center; gap: 5px; background: rgba(0,230,118,0.12); border: 1px solid rgba(0,230,118,0.4); border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--green); font-family: 'Orbitron', sans-serif; }

  .page { padding: 14px; }

  /* ⭐⭐ BACK BUTTON - সুন্দর ডিজাইন */
  .back-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(124,77,255,0.1)); border: 1px solid rgba(0,212,255,0.5); color: var(--cyan); padding: 10px 18px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; margin-bottom: 16px; letter-spacing: 1.5px; box-shadow: 0 4px 15px rgba(0,212,255,0.2); transition: 0.2s; }
  .back-btn:active { transform: scale(0.97); }
  .back-btn .arrow { font-size: 16px; }

  /* HERO */
  .hero-wrap { position: relative; width: 100%; height: 220px; border-radius: 16px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--border2); background: linear-gradient(135deg, #0a1220, #1a2c47); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .hero-track { display: flex; width: 100%; height: 100%; transition: transform 0.5s ease; }
  .hero-slide { flex: 0 0 100%; width: 100%; height: 100%; position: relative; }
  .hero-media { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.5) 70%, rgba(5,8,16,0.9)); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  .hero-title { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 30px rgba(0,212,255,0.5); letter-spacing: 2px; }
  .hero-sub { font-size: 12px; color: var(--cyan); letter-spacing: 3px; margin-top: 6px; }
  .hero-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
  .hero-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
  .hero-dot.active { background: var(--cyan); width: 24px; border-radius: 4px; }
  .hero-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, #0a1220, #1a2c47); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }

  /* PREMIUM HEADER */
  .premium-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; padding: 0 4px; }
  .ph-left { display: flex; align-items: center; gap: 10px; }
  .ph-icon { font-size: 28px; }
  .ph-text h2 { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 800; color: #fff; }
  .ph-text small { font-size: 10px; color: var(--muted); }
  .ph-right { display: flex; align-items: center; gap: 6px; background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.3); border-radius: 20px; padding: 6px 12px; }
  .live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .ph-right .text { font-size: 10px; color: var(--muted); font-weight: 600; }
  .ph-right .count { font-family: 'Orbitron', sans-serif; font-size: 12px; color: var(--cyan); font-weight: 800; }

  /* RECENT ORDERS */
  .recent-orders { background: linear-gradient(90deg, rgba(124,77,255,0.12), rgba(255,64,129,0.12)); border: 1px solid rgba(124,77,255,0.3); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; overflow: hidden; }
  .ro-label { font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; color: #b39ddb; letter-spacing: 1.5px; flex-shrink: 0; }
  .ro-scroll { flex: 1; overflow: hidden; position: relative; height: 20px; }
  .ro-item { font-size: 12px; color: #fff; white-space: nowrap; animation: scroll 15s linear infinite; }
  .ro-item b { color: var(--orange); }
  @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

  /* CATS */
  .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cat-chip { flex-shrink: 0; padding: 8px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
  .cat-chip.active { background: linear-gradient(135deg, #00d4ff, #7c4dff); border-color: transparent; color: #fff; }
  .cat-chip .count-badge { background: rgba(0,0,0,0.4); color: #fff; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-family: 'Orbitron', sans-serif; font-weight: 700; }
  .cat-chip.active .count-badge { background: rgba(255,255,255,0.25); }

  /* PRODUCT CARD */
  .product { background: linear-gradient(145deg, #0d1826, #050810); border: 1px solid var(--border2); border-radius: 16px; margin-bottom: 16px; overflow: hidden; position: relative; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  .product-media-wrap { position: relative; width: 100%; height: 180px; background: #0a1220; overflow: hidden; }
  .product-media { width: 100%; height: 100%; object-fit: cover; display: block; }
  .product-img-ph { width: 100%; height: 180px; background: linear-gradient(135deg, #0a1220, #1a2c47); display: flex; align-items: center; justify-content: center; font-size: 60px; color: var(--muted); }
  .status-online { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; font-family: 'Orbitron', sans-serif; display: flex; align-items: center; gap: 5px; background: rgba(0,230,118,0.2); color: var(--green); border: 1px solid var(--green); backdrop-filter: blur(8px); }
  .status-online .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
  .status-hot { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; background: linear-gradient(135deg, #ff9800, #ff5722); color: #fff; display: flex; align-items: center; gap: 4px; box-shadow: 0 4px 12px rgba(255,152,0,0.5); }
  .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: rgba(255,0,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(255,0,0,0.5); z-index: 5; }
  .play-btn::after { content: ''; width: 0; height: 0; border-left: 18px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 5px; }

  .product-body { padding: 16px; }
  .product-title { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 800; color: #fff; text-align: center; margin-bottom: 12px; }
  .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .feature-item { background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.2); border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #d7e8ff; font-weight: 500; }
  .feature-item .fi-icon { font-size: 14px; flex-shrink: 0; }

  .purchase-btn { width: 100%; background: linear-gradient(135deg, #00d4ff, #0099ff); border: none; padding: 15px; border-radius: 12px; color: #fff; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,212,255,0.4); }

  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: rgba(8,14,24,0.98); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 4px 10px; z-index: 200; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; cursor: pointer; position: relative; }
  .nav-item .ico { font-size: 20px; filter: grayscale(1) opacity(0.5); }
  .nav-item .lbl { font-size: 10px; color: var(--muted); font-weight: 500; }
  .nav-item.active .ico { filter: none; transform: scale(1.15); }
  .nav-item.active .lbl { color: var(--cyan); font-weight: 700; }
  .nav-item.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 30px; height: 2px; background: var(--cyan); border-radius: 2px; }

  /* FLOATING CHAT */
  .float-chat { position: fixed; bottom: 100px; left: calc(50% - 240px); width: 50px; height: 50px; background: linear-gradient(135deg, #00d4ff, #7c4dff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; box-shadow: 0 6px 25px rgba(0,212,255,0.5); cursor: pointer; z-index: 150; animation: floatBounce 3s ease-in-out infinite; }
  @keyframes floatBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @media (max-width: 520px) { .float-chat { left: 14px; } }

  /* LOGIN / REGISTER */
  .login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; background: radial-gradient(ellipse at center top, #1a0320, #050810 70%); }
  .login-wrap::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,64,129,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,64,129,0.03) 1px, transparent 1px); background-size: 30px 30px; pointer-events: none; }
  .login-card { width: 100%; max-width: 420px; background: linear-gradient(145deg, rgba(30,15,40,0.95), rgba(15,8,25,0.95)); border: 1px solid rgba(255,64,129,0.35); border-radius: 20px; padding: 24px 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(255,64,129,0.15); position: relative; z-index: 2; }
  .login-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #ff4081, transparent); border-radius: 20px 20px 0 0; }
  .next-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,64,129,0.1); border: 1px solid rgba(255,64,129,0.4); border-radius: 20px; padding: 6px 14px; font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; color: #ff4081; letter-spacing: 2px; margin: 0 auto 16px; width: fit-content; }
  .next-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4081; box-shadow: 0 0 10px #ff4081; animation: pulse 1.5s infinite; }
  .login-title { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; text-align: center; margin-bottom: 6px; letter-spacing: 3px; }
  .login-title .t1 { color: #fff; }
  .login-title .t2 { background: linear-gradient(135deg, #ff4081, #ff1744); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .login-sub { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 24px; }
  .lf-label { display: block; font-family: 'Orbitron', sans-serif; font-size: 10px; color: #d7a8b8; letter-spacing: 2px; margin-top: 14px; margin-bottom: 6px; font-weight: 600; }
  .lf-input-wrap { position: relative; display: flex; align-items: center; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,64,129,0.25); border-radius: 12px; padding: 0 14px; transition: 0.2s; }
  .lf-input-wrap:focus-within { border-color: #ff4081; box-shadow: 0 0 0 3px rgba(255,64,129,0.15); }
  .lf-icon { font-size: 15px; margin-right: 10px; opacity: 0.7; }
  .lf-input-wrap input { flex: 1; background: transparent; border: none; color: var(--text); padding: 14px 0; font-size: 14px; margin: 0; outline: none; font-family: 'Hind Siliguri', sans-serif; }
  .lf-input-wrap input::placeholder { color: #5a3a48; }
  .lf-input-wrap select { flex: 1; background: transparent; border: none; color: var(--text); padding: 14px 0; font-size: 14px; margin: 0; outline: none; font-family: 'Hind Siliguri', sans-serif; }
  .lf-input-wrap select option { background: #1a0f22; color: #fff; }
  .lf-eye { background: transparent; border: none; color: #a87890; font-size: 15px; cursor: pointer; padding: 8px; margin: 0; width: auto; }
  .create-btn { width: 100%; background: linear-gradient(135deg, #ff4081, #ff1744); color: #fff; border: none; padding: 15px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 2px; margin-top: 20px; cursor: pointer; box-shadow: 0 8px 25px rgba(255,64,129,0.5); }
  .create-btn:disabled { opacity: 0.5; }
  .or-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--muted); font-size: 11px; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
  .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,64,129,0.3), transparent); }
  .google-btn { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .switch-tab { text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
  .switch-tab a { color: #ff4081; font-weight: 700; cursor: pointer; text-decoration: underline; }

  /* FORMS */
  input, select, textarea { width: 100%; padding: 12px 14px; background: var(--card); border: 1px solid var(--border2); border-radius: 10px; color: var(--text); font-size: 14px; margin-top: 6px; font-family: 'Hind Siliguri', sans-serif; }
  input:focus, select:focus { outline: none; border-color: var(--cyan); }
  input::placeholder { color: #4a5f7a; }
  label { font-size: 12px; color: var(--muted); display: block; margin-top: 12px; font-weight: 500; }
  .btn-primary { width: 100%; background: linear-gradient(135deg, #00c853, #00e676); color: #00291a; border: none; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 800; margin-top: 14px; cursor: pointer; }
  .btn-primary:disabled { opacity: 0.5; }
  .btn-blue { background: linear-gradient(135deg, #00d4ff, #7c4dff); color: #fff; }
  .btn-gray { background: var(--card); color: var(--text); border: 1px solid var(--border2); }
  .btn-danger { background: linear-gradient(135deg, #ff1744, #d50000); color: #fff; }
  .btn-telegram { background: linear-gradient(135deg, #0088cc, #00b8d4); color: #fff; }
  .box { background: linear-gradient(145deg, var(--card), var(--card2)); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .box-title { font-size: 14px; font-weight: 700; color: var(--cyan); margin-bottom: 10px; }
  .msg { padding: 11px; border-radius: 10px; margin-top: 10px; font-size: 12px; text-align: center; font-weight: 500; }
  .msg.ok { background: rgba(0,230,118,0.15); color: #69f0ae; border: 1px solid rgba(0,230,118,0.4); }
  .msg.err { background: rgba(255,23,68,0.15); color: #ff8a80; border: 1px solid rgba(255,23,68,0.4); }
  .msg.warn { background: rgba(255,152,0,0.15); color: #ffcc80; border: 1px solid rgba(255,152,0,0.4); }

  /* PLATFORM OVERVIEW */
  .platform-overview { background: linear-gradient(145deg, rgba(20,25,45,0.9), rgba(10,15,30,0.9)); border: 1px solid var(--border2); border-radius: 18px; padding: 20px; margin-top: 16px; margin-bottom: 16px; }
  .po-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .po-header .icon { width: 32px; height: 32px; background: linear-gradient(135deg, #00d4ff, #7c4dff); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #fff; }
  .po-header h2 { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 800; color: #fff; }
  .po-desc { font-size: 13px; color: #a8b8d0; line-height: 1.7; margin-bottom: 16px; }
  .po-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .po-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #d7e8ff; line-height: 1.5; }
  .po-list li::before { content: '✓'; color: var(--green); font-size: 12px; font-weight: 900; flex-shrink: 0; width: 20px; height: 20px; background: rgba(0,230,118,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .po-telegram-note { margin-top: 16px; padding: 12px; background: rgba(255,64,129,0.08); border: 1px solid rgba(255,64,129,0.3); border-radius: 10px; color: #ff8aa8; font-size: 12px; line-height: 1.6; text-align: center; font-weight: 600; }

  /* KEY ITEM */
  .key-item { background: linear-gradient(145deg, var(--card), var(--card2)); border: 1px solid var(--border2); border-radius: 14px; padding: 16px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .key-item::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: linear-gradient(180deg, var(--green), var(--cyan)); box-shadow: 0 0 12px var(--green); }
  .ki-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
  .ki-title { font-size: 15px; font-weight: 700; color: #fff; flex: 1; }
  .ki-duration { background: rgba(255,152,0,0.15); border: 1px solid var(--orange); color: var(--orange); padding: 3px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .ki-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .ki-meta-box { background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2); border-radius: 8px; padding: 8px 10px; text-align: center; }
  .ki-meta-box .mlbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }
  .ki-meta-box .mval { font-size: 12px; font-weight: 700; color: var(--cyan); margin-top: 3px; }
  .key-display-box { background: linear-gradient(145deg, rgba(0,230,118,0.08), rgba(0,212,255,0.08)); border: 2px dashed var(--green); border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 12px; position: relative; overflow: hidden; }
  .key-display-box::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0,230,118,0.2), transparent); animation: sweep 3s linear infinite; }
  @keyframes sweep { 0%{left:-100%} 100%{left:100%} }
  .key-display-box .k-lbl { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; position: relative; }
  .key-display-box .k-val { font-family: 'Orbitron', monospace; font-size: 18px; font-weight: 900; color: var(--green); letter-spacing: 3px; word-break: break-all; text-shadow: 0 0 12px rgba(0,230,118,0.6); position: relative; margin-bottom: 8px; }
  .key-display-box .copy-btn { background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.5); color: var(--cyan); padding: 8px 16px; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: 700; position: relative; }

const firebaseConfig = {

let S = {

function toast(msg, type = 'ok') {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast ' + (type === 'err' ? 'err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.transition = '0.3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2200);
}

onAuthStateChanged(auth, async (user) => {
  S.loading = false;
  if (user) {
    S.user = user;
    try {
      const uRef = ref(db, 'users/' + user.uid);
      const snap = await get(uRef);
      if (!snap.exists()) {
        const nd = { uid: user.uid, email: user.email, name: user.displayName || '', balance: 0, banned: false, createdAt: Date.now() };
        await set(uRef, nd); S.userData = nd;
      } else {
        S.userData = snap.val();
        if (S.userData.banned) { await signOut(auth); toast('Account banned', 'err'); S.user = null; S.userData = null; render(); return; }
      }
      await loadSettings();
    } catch (e) { console.error(e); }
  } else { S.user = null; S.userData = null; }
  render();
  if (S.user) loadData();
});

async function loadSettings() {
  try {
    const s = await get(ref(db, 'settings'));
    if (s.exists()) { S.settings = s.val(); if (!S.settings.slider) S.settings.slider = []; }
    else { S.settings = { durations: {}, methods: {}, slider: [] }; }
  } catch (e) {}
}

async function loadData() {
  try {
    const pS = await get(ref(db, 'panels'));
    S.panels = pS.exists() ? Object.keys(pS.val()).map(k => ({ id: k, ...pS.val()[k] })) : [];
    const tS = await get(ref(db, 'transactions'));
    if (tS.exists()) {
      const all = Object.keys(tS.val()).map(k => ({ id: k, ...tS.val()[k] }));
      S.myKeys = all.filter(t => t.uid === S.user.uid && t.status === 'approved' && (t.type === 'purchase' || !t.type));
      S.txns = all.filter(t => t.uid === S.user.uid).sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
    }
  } catch (e) {}
  render();
}

function render() {
  const root = document.getElementById('root');
  if (S.loading) { root.innerHTML = '<div class="empty-state" style="margin-top:100px"><div class="big">◈</div><p>Loading...</p></div>'; return; }
  if (!S.user) { root.innerHTML = renderLogin(); bindLogin(); return; }
  root.innerHTML = renderApp();
  bindApp();
}

function renderLogin() {

      <div id="lmsg"></div>
    </div>
  </div>`;
}

function bindLogin() {
  document.getElementById('tabL').onclick = () => { S.authTab = 'login'; render(); };
  document.getElementById('tabR').onclick = () => { S.authTab = 'register'; render(); };
  const sw = document.getElementById('switchTab');
  if (sw) sw.onclick = () => { S.authTab = S.authTab === 'login' ? 'register' : 'login'; render(); };
  const t1 = document.getElementById('togglePass1'); const p1 = document.getElementById('lpass');
  if (t1) t1.onclick = () => { p1.type = p1.type === 'password' ? 'text' : 'password'; t1.textContent = p1.type === 'password' ? '👁️' : '🙈'; };
  const t2 = document.getElementById('togglePass2'); const p2 = document.getElementById('lpass2');
  if (t2) t2.onclick = () => { p2.type = p2.type === 'password' ? 'text' : 'password'; t2.textContent = p2.type === 'password' ? '👁️' : '🙈'; };
  document.getElementById('lBtn').onclick = async () => {
    const email = document.getElementById('lemail').value.trim().toLowerCase();
    const pass = document.getElementById('lpass').value;
    const btn = document.getElementById('lBtn'); const isLogin = S.authTab === 'login';
    if (!/^\S+@\S+\.\S+$/.test(email)) return loginMsg('Enter valid email', 'err');
    if (pass.length < 6) return loginMsg('Password min 6 chars', 'err');
    btn.disabled = true; btn.textContent = 'Processing...';

      if (isLogin) await signInWithEmailAndPassword(auth, email, pass);
      else {
        const name = document.getElementById('lname').value.trim();
        const pass2 = document.getElementById('lpass2').value;
        if (!name) { btn.disabled=false; btn.textContent='→ CREATE ACCOUNT'; return loginMsg('Enter your name', 'err'); }

      btn.disabled = false; btn.textContent = isLogin ? '→ LOGIN' : '→ CREATE ACCOUNT';

      loginMsg(m[e.code] || e.code, 'err');
    }
  };
}

/* STORE TAB */
function renderStoreTab() {

function initHeroSlider() {
  const track = document.getElementById('heroTrack');
  const dots = document.querySelectorAll('.hero-dot');
  if (!track || dots.length === 0) return;
  let current = 0; const total = dots.length;
  const goTo = (idx) => { current = idx; track.style.transform = `translateX(-${current * 100}%)`; dots.forEach((d, i) => d.classList.toggle('active', i === current)); };
  dots.forEach(d => { d.onclick = () => goTo(parseInt(d.dataset.slide)); });
  if (window.__heroTimer) clearInterval(window.__heroTimer);
  if (total > 1) window.__heroTimer = setInterval(() => { goTo((current + 1) % total); }, 4000);
  let startX = 0, isDragging = false;
  track.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; isDragging = true; });
  track.addEventListener('touchend', (e) => {
    if (!isDragging) return;
    const diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) { diff > 0 ? goTo((current + 1) % total) : goTo((current - 1 + total) % total); }
    isDragging = false;
  });
}

async function submitDeposit() {
  const method = document.getElementById('depMethod').value;
  const amount = parseInt(document.getElementById('depAmount').value || '0');
  const trxId = document.getElementById('depTrx').value.trim().toUpperCase();
  const btn = document.getElementById('depSubmit'); const msg = document.getElementById('depMsg');
  const showM = (t, type) => { msg.className = 'msg ' + type; msg.textContent = t; };
  if (amount <= 0) return showM('Enter valid amount', 'err');
  btn.disabled = true; btn.textContent = 'Verifying...';
  try {
    if (trxId) {
      const usedS = await get(ref(db, 'used_trx_ids/' + trxId));
      if (usedS.exists()) { btn.disabled=false; btn.textContent='✦ Submit'; return showM('TrxID already used', 'err'); }
    }
    const tRef = push(ref(db, 'transactions'));
    await set(tRef, { uid: S.user.uid, email: S.user.email, name: S.userData?.name || '', amount, method, trxId, screenshotNote: '📸 Screenshot sent to Admin', type: 'deposit', panelName: 'Balance Deposit', status: 'pending', createdAt: Date.now() });
    if (trxId) await set(ref(db, 'used_trx_ids/' + trxId), { trxId, usedBy: S.user.uid, usedAt: Date.now() });
    showM('✓ Submitted! Admin will verify', 'ok');
    btn.textContent = '✓ Submitted';
    setTimeout(() => { S.showDepositModal = false; S.tab = 'history'; render(); }, 1500);
  } catch (e) { btn.disabled = false; btn.textContent = '✦ Submit'; showM('Error: ' + e.message, 'err'); }
}

async function buyPanel() {
  const p = S.buyingPanel; const dur = S.selectedDuration; const price = p['price'+dur];
  const btn = document.getElementById('confirmBuy'); const msg = document.getElementById('buyMsg');
  const showM = (t, type) => { msg.className = 'msg ' + type; msg.textContent = t; };
  const bal = S.userData?.balance || 0;
  if (bal < price) return showM('Insufficient balance', 'err');
  btn.disabled = true; btn.textContent = 'Processing...';

  document.getElementById('successCopyBtn').onclick = () => { navigator.clipboard.writeText(password).then(() => toast('✓ Copied')); };
  
  // Back button top
  document.getElementById('succBackTop').onclick = () => {
    modal.remove();
    S.buyingPanel = panel; S.selectedDuration = null;
    render();
  };
  
  // Back button bottom
  document.getElementById('succBackBtn').onclick = () => {
    modal.remove();
    S.tab = 'store';
    render();
  };
  
  // My Keys
  document.getElementById('succCloseBtn').onclick = () => {
    modal.remove();
    S.tab = 'keys';
    render();
  };
}
</script>
</body>
</html>
